<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">wastedRAM — put spare memory to work</title>
  <desc id="desc">A neon green memory gauge routes local AI tasks before a cloud connection.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1014"/>
      <stop offset="0.55" stop-color="#101b20"/>
      <stop offset="1" stop-color="#1b2030"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6ff81"/>
      <stop offset="1" stop-color="#8eea6d"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfff71"/>
      <stop offset="1" stop-color="#8b86ff"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#a9c8af" stroke-opacity=".095"/>
    </pattern>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <rect width="1600" height="520" rx="30" fill="url(#background)"/>
  <rect width="1600" height="520" rx="30" fill="url(#grid)"/>
  <ellipse cx="1385" cy="415" rx="260" ry="200" fill="#8bec75" opacity=".09" filter="url(#blur)"/>
  <ellipse cx="260" cy="40" rx="190" ry="120" fill="#7866e5" opacity=".12" filter="url(#blur)"/>

  <g transform="translate(92 79)">
    <rect width="61" height="61" rx="16" fill="url(#lime)"/>
    <path d="M11 19l10 24 10-20 10 20 10-24" fill="none" stroke="#14201a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="81" y="41" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#b7f47d">LOCAL AI ROUTER</text>
  </g>

  <text x="88" y="242" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="105" font-weight="800" letter-spacing="-5" fill="#f3f8f3">wasted<tspan fill="url(#lime)">RAM</tspan></text>
  <text x="93" y="307" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="650" fill="#e6eee4">别让内存闲着。</text>
  <text x="93" y="352" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" fill="#b7c8bd">Local first. Cloud when it counts.</text>

  <g transform="translate(92 399)">
    <rect width="191" height="49" rx="24.5" fill="#b6f878" fill-opacity=".12" stroke="#a7ef79" stroke-opacity=".7"/>
    <circle cx="26" cy="24.5" r="7" fill="#bcff7c"/>
    <text x="46" y="32" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#d7ffad">8–128 GB</text>
    <rect x="206" width="214" height="49" rx="24.5" fill="#8e84ff" fill-opacity=".12" stroke="#8e84ff" stroke-opacity=".65"/>
    <text x="234" y="32" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#dad7ff">MLX + Cloud API</text>
  </g>

  <g transform="translate(1040 55)">
    <rect width="430" height="387" rx="31" fill="#19262a" stroke="#51675b" stroke-width="2"/>
    <rect x="17" y="17" width="396" height="353" rx="22" fill="#1f302e" stroke="#32483e"/>
    <path d="M0 70h-17m17 42h-17m17 42h-17m17 42h-17m17 42h-17m17 42h-17m447-210h-17m17 42h-17m17 42h-17m17 42h-17m17 42h-17m17 42h-17" stroke="#899f8a" stroke-width="8" stroke-linecap="round"/>
    <text x="46" y="76" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="700" letter-spacing="2" fill="#dbf5da">UNIFIED MEMORY</text>
    <text x="46" y="110" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" letter-spacing="2" fill="#a2b7a7">RIGHT-SIZED MODEL</text>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700">
      <text x="48" y="163" fill="#b9c9bd">8</text>
      <text x="48" y="214" fill="#b9c9bd">32</text>
      <text x="48" y="265" fill="#b9c9bd">64</text>
      <text x="48" y="316" fill="#b9c9bd">128</text>
    </g>
    <g fill="#32463c">
      <rect x="107" y="138" width="265" height="25" rx="12.5"/>
      <rect x="107" y="189" width="265" height="25" rx="12.5"/>
      <rect x="107" y="240" width="265" height="25" rx="12.5"/>
      <rect x="107" y="291" width="265" height="25" rx="12.5"/>
    </g>
    <g fill="url(#lime)">
      <rect x="107" y="138" width="80" height="25" rx="12.5"/>
      <rect x="107" y="189" width="130" height="25" rx="12.5"/>
      <rect x="107" y="240" width="191" height="25" rx="12.5"/>
      <rect x="107" y="291" width="265" height="25" rx="12.5"/>
    </g>
    <circle cx="372" cy="343" r="7" fill="#bbfd7a"/>
    <text x="46" y="350" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" fill="#b9d2bc">SPARE RAM → LOCAL TOKENS</text>
  </g>
  <path d="M850 175h150" stroke="url(#path)" stroke-width="5" stroke-linecap="round" stroke-dasharray="11 13" opacity=".8"/>
  <circle cx="1000" cy="175" r="9" fill="#b5f978"/>
</svg>
