<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">wastedRAM — make more of your Mac's memory</title>
  <desc id="desc">A MacBook illustration shows a right-sized local AI model routing harder tasks to the cloud.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eaf6ff"/>
      <stop offset="1" stop-color="#cfe8fb"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f9fcff"/>
      <stop offset="1" stop-color="#edf6ff"/>
    </linearGradient>
    <linearGradient id="display" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102943"/>
      <stop offset="1" stop-color="#1b4568"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6ba9e8"/>
      <stop offset="1" stop-color="#77c9ef"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#ffffff" stroke-opacity=".45"/>
    </pattern>
  </defs>

  <rect width="1600" height="560" rx="24" fill="url(#background)"/>
  <rect width="1600" height="560" rx="24" fill="url(#grid)"/>
  <ellipse cx="1135" cy="472" rx="385" ry="31" fill="#557f9e" opacity=".2" filter="url(#shadow)"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="88" y="111" fill="#327fbd" font-size="16" font-weight="750" letter-spacing="2.2">LOCAL AI FOR THE MAC YOU ALREADY OWN</text>
    <text x="82" y="226" fill="#14283a" font-size="76" font-weight="760">wasted<tspan fill="#438dc9">RAM</tspan></text>
    <text x="88" y="279" fill="#233b4e" font-size="27" font-weight="550">Put spare memory to work.</text>
    <text x="88" y="325" fill="#50697b" font-size="20">A right-sized local model handles what it can.</text>
    <text x="88" y="355" fill="#50697b" font-size="20">Cloud handles the rest.</text>
    <g transform="translate(88 404)">
      <rect width="148" height="42" rx="8" fill="#438dc9"/>
      <text x="19" y="27" fill="#ffffff" font-size="15" font-weight="750">LOCAL FIRST</text>
      <text x="168" y="27" fill="#34536a" font-size="16" font-weight="650">Apple Silicon · MLX · Cloud API</text>
    </g>
  </g>

  <g>
    <rect x="828" y="68" width="530" height="371" rx="22" fill="#5b7488" opacity=".16" filter="url(#shadow)"/>
    <rect x="826" y="53" width="516" height="336" rx="22" fill="#f7fbff" stroke="#8da9bf" stroke-width="3"/>
    <rect x="840" y="67" width="488" height="308" rx="13" fill="#ffffff" stroke="#d2e1ed" stroke-width="1.5"/>
    <rect x="852" y="80" width="464" height="282" rx="8" fill="url(#display)"/>
    <circle cx="1084" cy="60" r="2.5" fill="#9aafc0"/>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <circle cx="875" cy="101" r="4" fill="#ef8c89"/>
      <circle cx="890" cy="101" r="4" fill="#ebc779"/>
      <circle cx="905" cy="101" r="4" fill="#8dc9a3"/>
      <text x="874" y="137" fill="#e5f2fb" font-size="14" font-weight="700" letter-spacing="1.1">TASK ROUTER</text>

      <rect x="874" y="153" width="187" height="157" rx="9" fill="#eaf5ff"/>
      <rect x="1074" y="153" width="218" height="157" rx="9" fill="#f3f2ff"/>
      <rect x="874" y="153" width="187" height="4" rx="2" fill="#8ac6ee"/>
      <rect x="1074" y="153" width="218" height="4" rx="2" fill="#9f9be0"/>
      <text x="890" y="181" fill="#4186bc" font-size="11" font-weight="750" letter-spacing=".7">ON YOUR MAC</text>
      <text x="890" y="207" fill="#203b52" font-size="16" font-weight="700">Right-sized model</text>
      <text x="890" y="234" fill="#526c7e" font-size="12">Short questions</text>
      <text x="890" y="255" fill="#526c7e" font-size="12">Everyday explanations</text>
      <text x="890" y="276" fill="#526c7e" font-size="12">Private local inference</text>
      <text x="1090" y="181" fill="#7975bd" font-size="11" font-weight="750" letter-spacing=".7">WHEN NEEDED</text>
      <text x="1090" y="207" fill="#34334e" font-size="16" font-weight="700">Cloud model</text>
      <text x="1090" y="234" fill="#686781" font-size="12">Complex requests</text>
      <text x="1090" y="255" fill="#686781" font-size="12">Larger coding tasks</text>
      <text x="1090" y="276" fill="#686781" font-size="12">Final synthesis</text>
      <path d="M1059 230h19" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="m1073 225 6 5-6 5" fill="none" stroke="#78bde5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="874" y="350" fill="#b7cde0" font-size="10" font-weight="600" letter-spacing=".8">UNIFIED MEMORY PUT TO WORK</text>
    </g>

    <path d="M805 390h558l91 68q13 10-9 13H727q-22-3-9-13z" fill="#afc3d2" stroke="#819caf" stroke-width="1.5"/>
    <path d="M819 392h530l78 61H741z" fill="#e3edf4"/>
    <path d="M876 398h418l47 35H843z" fill="#c5d7e4"/>
    <g fill="#91aabc" opacity=".8">
      <path d="M887 401h31l4 5h-32z M924 401h31l4 5h-32z M961 401h31l4 5h-32z M998 401h31l4 5h-32z M1035 401h31l4 5h-32z M1072 401h31l4 5h-32z M1109 401h31l4 5h-32z M1146 401h31l4 5h-32z M1183 401h31l4 5h-32z M1220 401h31l4 5h-32z M1257 401h27l4 5h-27z"/>
      <path d="M881 410h32l4 5h-33z M919 410h32l4 5h-33z M957 410h32l4 5h-33z M995 410h32l4 5h-33z M1033 410h32l4 5h-33z M1071 410h32l4 5h-33z M1109 410h32l4 5h-33z M1147 410h32l4 5h-33z M1185 410h32l4 5h-33z M1223 410h32l4 5h-33z M1261 410h27l4 5h-28z"/>
      <path d="M873 419h35l4 5h-36z M914 419h35l4 5h-36z M955 419h35l4 5h-36z M996 419h35l4 5h-36z M1037 419h35l4 5h-36z M1078 419h35l4 5h-36z M1119 419h35l4 5h-36z M1160 419h35l4 5h-36z M1201 419h35l4 5h-36z M1242 419h35l4 5h-36z"/>
      <path d="M872 428h54l4 5h-55z M936 428h45l4 5h-46z M991 428h126l4 5h-127z M1127 428h45l4 5h-46z M1182 428h54l4 5h-55z"/>
    </g>
    <path d="M1002 438h147l17 20h-180z" fill="#c0d2df" stroke="#9cb3c4" stroke-width="1"/>
    <path d="M727 471h718" stroke="#f9fcff" stroke-width="2" opacity=".9"/>
  </g>

  <path d="M1360 155c50 0 69 26 69 63v36" fill="none" stroke="#498fc5" stroke-opacity=".75" stroke-width="2" stroke-dasharray="5 8"/>
  <circle cx="1429" cy="256" r="4" fill="#498fc5"/>
  <g transform="translate(1354 272)" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="188" height="67" rx="9" fill="#ffffff" stroke="#c1d7e8"/>
    <text x="16" y="26" fill="#638eb1" font-size="11" font-weight="750" letter-spacing=".8">CLOUD</text>
    <text x="16" y="48" fill="#29475f" font-size="14" font-weight="650">Only when it counts</text>
  </g>
  <circle cx="1546" cy="294" r="4" fill="#9c98d8"/>
</svg>
