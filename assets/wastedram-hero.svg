<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">wastedRAM — make more of your Mac's memory</title>
  <desc id="desc">A MacBook runs a right-sized local AI model and sends harder tasks to the cloud.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101a19"/>
      <stop offset="1" stop-color="#202b25"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172521"/>
      <stop offset="1" stop-color="#23352c"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#d2ff83"/>
      <stop offset="1" stop-color="#8debb7"/>
    </linearGradient>
    <pattern id="grain-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#d5eddb" stroke-opacity=".045"/>
    </pattern>
  </defs>

  <rect width="1600" height="560" rx="24" fill="url(#field)"/>
  <rect width="1600" height="560" rx="24" fill="url(#grain-grid)"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="88" y="113" fill="#b9f77d" font-size="17" font-weight="700" letter-spacing="2.4">LOCAL AI FOR THE MAC YOU ALREADY OWN</text>
    <text x="82" y="230" fill="#f4f5ed" font-size="76" font-weight="760">wasted<tspan fill="#b9f77d">RAM</tspan></text>
    <text x="88" y="281" fill="#dce5da" font-size="27" font-weight="520">Put spare memory to work.</text>
    <text x="88" y="326" fill="#aebdb1" font-size="20">A smaller local model handles what it can.</text>
    <text x="88" y="355" fill="#aebdb1" font-size="20">Cloud handles the rest.</text>

    <g transform="translate(88 404)">
      <rect width="166" height="42" rx="8" fill="#b9f77d"/>
      <text x="20" y="27" fill="#162019" font-size="15" font-weight="750">LOCAL FIRST</text>
      <text x="188" y="27" fill="#d1ddd2" font-size="16" font-weight="600">Apple Silicon · MLX · Cloud API</text>
    </g>
  </g>

  <g transform="translate(765 95)">
    <rect x="0" y="0" width="514" height="334" rx="18" fill="#0c1110" stroke="#849188" stroke-opacity=".72" stroke-width="2"/>
    <rect x="13" y="13" width="488" height="308" rx="10" fill="url(#screen)"/>

    <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <circle cx="38" cy="41" r="5" fill="#f08070"/>
      <circle cx="57" cy="41" r="5" fill="#e9c773"/>
      <circle cx="76" cy="41" r="5" fill="#a8d980"/>
      <text x="36" y="88" fill="#dbe8d9" font-size="16" font-weight="700" letter-spacing="1.2">TASK ROUTER</text>

      <rect x="36" y="108" width="196" height="164" rx="10" fill="#26392e" stroke="#5c7860"/>
      <rect x="260" y="108" width="218" height="164" rx="10" fill="#28293a" stroke="#7476a5"/>
      <text x="55" y="140" fill="#c8fa93" font-size="13" font-weight="750" letter-spacing="1">ON YOUR MAC</text>
      <text x="55" y="171" fill="#f0f3e8" font-size="19" font-weight="700">Right-sized model</text>
      <text x="55" y="202" fill="#b8c9b8" font-size="14">Short questions</text>
      <text x="55" y="225" fill="#b8c9b8" font-size="14">Everyday explanations</text>
      <text x="55" y="248" fill="#b8c9b8" font-size="14">Private local inference</text>
      <text x="279" y="140" fill="#c7c6ff" font-size="13" font-weight="750" letter-spacing="1">WHEN NEEDED</text>
      <text x="279" y="171" fill="#f0efff" font-size="19" font-weight="700">Cloud model</text>
      <text x="279" y="202" fill="#c0bfd4" font-size="14">Complex requests</text>
      <text x="279" y="225" fill="#c0bfd4" font-size="14">Larger coding tasks</text>
      <text x="279" y="248" fill="#c0bfd4" font-size="14">Final synthesis</text>

      <path d="M228 190h38" stroke="url(#route)" stroke-width="3" stroke-linecap="round"/>
      <path d="m258 183 8 7-8 7" fill="none" stroke="#a9eea0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="301" fill="#9cac9e" font-size="12" letter-spacing="1">UNIFIED MEMORY PUT TO WORK</text>
    </g>

    <path d="M-25 336h564l-52 26H27z" fill="#849188"/>
    <path d="M27 336h486l-29 17H56z" fill="#c0c8c1"/>
    <path d="M214 341h137l-12 8H226z" fill="#89958c"/>
    <path d="M-25 336h564" stroke="#e2e9e1" stroke-width="2"/>
  </g>

  <path d="M1300 167c60 0 67 35 67 78v45" fill="none" stroke="#b9f77d" stroke-opacity=".8" stroke-width="2" stroke-dasharray="5 8"/>
  <circle cx="1367" cy="301" r="5" fill="#b9f77d"/>
  <g transform="translate(1320 313)" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect width="199" height="69" rx="10" fill="#28293a" stroke="#7476a5"/>
    <text x="18" y="28" fill="#c7c6ff" font-size="12" font-weight="700" letter-spacing="1">CLOUD</text>
    <text x="18" y="50" fill="#efeffc" font-size="15" font-weight="600">Only when it counts</text>
  </g>
</svg>
