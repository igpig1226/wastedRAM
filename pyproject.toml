[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wastedram"
version = "0.1.0"
description = "Use spare Mac memory for local LLM tasks and save cloud tokens"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "igpig1226"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.19"]

[project.scripts]
wastedram = "wastedram.cli:main"

[project.urls]
Homepage = "https://github.com/igpig1226/wastedRAM"
Source = "https://github.com/igpig1226/wastedRAM"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/wastedram/skills/wastedram" = ["skills/wastedram/SKILL.md"]
